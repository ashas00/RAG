[project]
name = "rag"
version = "0.1.0"
description = "Retrieval-Augmented Generation over the vLLM codebase"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.14",
    "fire>=0.7.1",
    "pydantic>=2.14.1",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.21.1",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/", "^data/", "^moulinette/"]
