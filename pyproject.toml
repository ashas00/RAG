[project]
name = "rag"
version = "0.1.0"
description = "Retrieval-Augmented Generation over the vLLM codebase"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bm25s>=0.3.14",
    "fire>=0.7.1",
    "huggingface-hub>=1.0.0",
    "numpy>=1.26",
    "pydantic>=2.14.1",
    "tokenizers>=0.22.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "types-tqdm",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/", "^data/"]

[[tool.mypy.overrides]]
module = ["bm25s", "fire"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
